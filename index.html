
<script>
"use strict";

/* =========================================================
   SIMULADOR ACADÊMICO DE MACHINE LEARNING
   - Importação robusta de CSV
   - Naive Bayes Multinomial real
   - Avaliação com conjunto de teste
   - Encaminhamento humano para sinais de atenção
   ========================================================= */

let datasetBruto = [];
let classesUnicas = [];
let resultadosConsolidados = {};
let historicoTestes = [];
let totalTestes = 0;
let totalAcertos = 0;
let totalErros = 0;
let modeloFinal = null;
let modeloTreino = null;
let matrizAtual = null;
let avaliacaoAtual = null;

const $ = id => document.getElementById(id);

function normalizar(texto) {
    return String(texto ?? "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim();
}

function escaparHTML(valor) {
    return String(valor ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[c]);
}

/* =========================================================
   1. IDENTIFICAÇÃO DE SINAIS QUE EXIGEM ATENÇÃO HUMANA

   Estas regras NÃO criam classes no modelo.
   Elas geram um alerta separado da previsão automática.
   ========================================================= */

function detectarNecessidadeAtendimentoHumano(texto) {
    const t = normalizar(texto);

    const regras = [
        {
            nome: "sangramento",
            regex: /\bsangramento(s)?\b|\bsangrando\b|\bsangrar\b/
        },
        {
            nome: "hemorragia",
            regex: /\bhemorragia(s)?\b/
        },
        {
            nome: "dor",
            regex: /\bdor(es)?\b|\bdolorido(a|s)?\b/
        },
        {
            nome: "febre",
            regex: /\bfebre(s)?\b|\bfebril\b/
        },
        {
            nome: "pressão alta",
            regex: /\bpressao alta\b|\bpressao arterial alta\b|\bpressao elevada\b|\bpressao muito alta\b|\bhipertensao\b/
        },
        {
            nome: "bebê não se mexe",
            regex: /\bbebe nao se mexe\b|\bbebe nao mexe\b|\bnao sinto o bebe mexer\b|\bbebe parou de mexer\b|\bmovimentos do bebe diminuiram\b|\bmovimentos fetais reduzidos\b/
        },
        {
            nome: "falta de ar",
            regex: /\bfalta de ar\b|\bdificuldade para respirar\b|\bdificuldade de respirar\b|\bnao consigo respirar\b/
        }
    ];

    return regras
        .filter(regra => regra.regex.test(t))
        .map(regra => regra.nome);
}

/* =========================================================
   2. LEITURA ROBUSTA DE CSV

   Trata aspas, delimitadores dentro de campos e quebras
   de linha dentro de campos entre aspas.
   ========================================================= */

function analisarCSV(conteudo, delimitador) {
    const linhas = [];
    let linha = [];
    let campo = "";
    let dentroAspas = false;

    conteudo = String(conteudo ?? "")
        .replace(/^\uFEFF/, "")
        .replace(/\r\n/g, "\n")
        .replace(/\r/g, "\n");

    for (let i = 0; i < conteudo.length; i++) {
        const ch = conteudo[i];

        if (ch === '"') {
            if (dentroAspas && conteudo[i + 1] === '"') {
                campo += '"';
                i++;
            } else {
                dentroAspas = !dentroAspas;
            }
        } else if (ch === delimitador && !dentroAspas) {
            linha.push(campo);
            campo = "";
        } else if (ch === "\n" && !dentroAspas) {
            linha.push(campo);
            if (linha.some(v => String(v).trim() !== "")) {
                linhas.push(linha);
            }
            linha = [];
            campo = "";
        } else {
            campo += ch;
        }
    }

    if (dentroAspas) {
        throw new Error(
            "Há aspas não fechadas no CSV. Verifique o arquivo."
        );
    }

    linha.push(campo);
    if (linha.some(v => String(v).trim() !== "")) {
        linhas.push(linha);
    }

    return linhas;
}

function contarDelimitadores(cabecalho, delimitador) {
    let dentroAspas = false;
    let total = 0;

    for (let i = 0; i < cabecalho.length; i++) {
        const ch = cabecalho[i];

        if (ch === '"') {
            if (dentroAspas && cabecalho[i + 1] === '"') {
                i++;
            } else {
                dentroAspas = !dentroAspas;
            }
        } else if (ch === delimitador && !dentroAspas) {
            total++;
        }
    }

    return total;
}

function identificarColuna(cabecalhos, tipo) {
    const nomes = cabecalhos.map((nome, indice) => ({
        nome: normalizar(nome).replace(/[^a-z0-9]/g, ""),
        indice
    }));

    const aliases = tipo === "texto"
        ? ["texto", "mensagem", "mensagens", "text", "frase", "conversa"]
        : ["classe", "classes", "rotulo", "label", "categoria", "target"];

    for (const alias of aliases) {
        const encontrada = nomes.find(item => item.nome === alias);
        if (encontrada) return encontrada.indice;
    }

    return -1;
}

function handleFileSelect(event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;

    esconderAlerta();

    $("file-name").textContent = file.name;
    $("file-size").textContent =
        (file.size / 1024).toFixed(1) + " KB";
    $("file-rows").textContent = "Lendo...";
    $("file-status").textContent = "Processando";
    $("file-status").className =
        "text-amber-600 block mt-0.5 font-medium";
    $("btn-submeter").disabled = true;

    const reader = new FileReader();

    reader.onload = function(e) {
        try {
            processarCSVRobusto(e.target.result);
        } catch (erro) {
            datasetBruto = [];
            classesUnicas = [];
            $("file-rows").textContent = "0";
            $("file-status").textContent = "Erro na leitura";
            $("file-status").className =
                "text-rose-600 block mt-0.5 font-medium";
            mostrarAlerta(erro.message || "Não foi possível ler o CSV.");
        }
    };

    reader.onerror = function() {
        mostrarAlerta(
            "Falha na leitura do arquivo. Tente selecionar o CSV novamente."
        );
        $("file-status").textContent = "Falha na leitura";
    };

    reader.readAsText(file, "UTF-8");
}

function processarCSVRobusto(conteudo) {
    const primeiraLinha = String(conteudo)
        .replace(/^\uFEFF/, "")
        .split(/\r\n|\n|\r/)[0] || "";

    const candidatos = [",", ";", "\t"];
    const delimitador = candidatos
        .map(d => ({ d, n: contarDelimitadores(primeiraLinha, d) }))
        .sort((a, b) => b.n - a.n)[0].d;

    const linhas = analisarCSV(conteudo, delimitador);

    if (linhas.length < 2) {
        throw new Error(
            "O arquivo precisa conter um cabeçalho e pelo menos um registro."
        );
    }

    const cabecalhos = linhas[0].map(v => String(v).trim());
    const colunaTexto = identificarColuna(cabecalhos, "texto");
    const colunaClasse = identificarColuna(cabecalhos, "classe");

    if (colunaTexto < 0 || colunaClasse < 0) {
        throw new Error(
            "Não encontrei as colunas texto e classe. " +
            "Confira se o cabeçalho contém exatamente esses nomes."
        );
    }

    const novosDados = [];
    let linhasInvalidas = 0;

    for (let i = 1; i < linhas.length; i++) {
        const campos = linhas[i];
        const texto = String(campos[colunaTexto] ?? "").trim();
        const classe = String(campos[colunaClasse] ?? "").trim();

        if (!texto || !classe) {
            linhasInvalidas++;
            continue;
        }

        novosDados.push({ texto, classe });
    }

    if (novosDados.length === 0) {
        throw new Error(
            "Nenhum registro válido foi encontrado nas colunas texto e classe."
        );
    }

    datasetBruto = novosDados;
    classesUnicas = [...new Set(datasetBruto.map(d => d.classe))]
        .sort((a, b) => a.localeCompare(b, "pt-BR"));

    $("file-rows").textContent = datasetBruto.length;
    $("file-status").textContent = "Carregado com sucesso";
    $("file-status").className =
        "text-emerald-600 block mt-0.5 font-medium";
    $("btn-submeter").disabled = false;

    renderizarPrimeirosRegistros();
    esconderAlerta();

    let mensagem =
        `CSV importado: ${datasetBruto.length} mensagens e ` +
        `${classesUnicas.length} classes.`;

    if (linhasInvalidas > 0) {
        mensagem += ` ${linhasInvalidas} linha(s) vazia(s) ou incompleta(s) foram ignoradas.`;
    }

    console.info(mensagem);
}

function renderizarPrimeirosRegistros() {

    datasetBruto.slice(0, 3).forEach((item, i) => {

            tr.appendChild(td);

        tbody.appendChild(tr);
    });

    $("preview-container").classList.remove("hidden");
}

}

/* =========================================================
   4. PREPARAÇÃO DOS DADOS E NAIVE BAYES MULTINOMIAL
   ========================================================= */

function tokenizar(texto) {
    return normalizar(texto).match(/[\p{L}\p{N}]+/gu) || [];
}

function embaralhar(array) {
    const resultado = array.slice();

    for (let i = resultado.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [resultado[i], resultado[j]] = [resultado[j], resultado[i]];
    }

    return resultado;
}

function dividirTreinoTeste(dados) {
    const porClasse = new Map();

    dados.forEach(item => {
        if (!porClasse.has(item.classe)) {
            porClasse.set(item.classe, []);
        }
        porClasse.get(item.classe).push(item);
    });

    const treino = [];
    const teste = [];

    for (const grupo of porClasse.values()) {
        const grupoEmbaralhado = embaralhar(grupo);

        if (grupoEmbaralhado.length === 1) {
            treino.push(grupoEmbaralhado[0]);
            continue;
        }

        let nTeste = Math.floor(grupoEmbaralhado.length * 0.2);
        nTeste = Math.max(1, nTeste);
        nTeste = Math.min(nTeste, grupoEmbaralhado.length - 1);

        teste.push(...grupoEmbaralhado.slice(0, nTeste));
        treino.push(...grupoEmbaralhado.slice(nTeste));
    }

    return {
        treino: embaralhar(treino),
        teste: embaralhar(teste)
    };
}

function treinarNaiveBayes(dados) {
    if (!dados.length) {
        throw new Error("Não há dados para treinar.");
    }

    const contagemClasses = new Map();
    const contagemPalavras = new Map();
    const totalPalavrasClasse = new Map();
    const vocabulario = new Set();

    dados.forEach(item => {
        const classe = item.classe;
        const tokens = tokenizar(item.texto);

        contagemClasses.set(
            classe,
            (contagemClasses.get(classe) || 0) + 1
        );

        if (!contagemPalavras.has(classe)) {
            contagemPalavras.set(classe, new Map());
            totalPalavrasClasse.set(classe, 0);
        }

        const mapa = contagemPalavras.get(classe);

        tokens.forEach(token => {
            vocabulario.add(token);
            mapa.set(token, (mapa.get(token) || 0) + 1);
            totalPalavrasClasse.set(
                classe,
                totalPalavrasClasse.get(classe) + 1
            );
        });
    });

    return {
        classes: [...contagemClasses.keys()].sort(),
        contagemClasses,
        contagemPalavras,
        totalPalavrasClasse,
        vocabulario,
        totalDocumentos: dados.length,
        alpha: 1
    };
}

function preverNaiveBayes(modelo, texto) {
    const tokens = tokenizar(texto);
    const palavrasConhecidas = tokens.filter(
        token => modelo.vocabulario.has(token)
    );

    const tamanhoVocabulario = Math.max(1, modelo.vocabulario.size);
    const pontuacoes = [];

    for (const classe of modelo.classes) {
        const nClasse = modelo.contagemClasses.get(classe);
        const prior = Math.log(nClasse / modelo.totalDocumentos);
        const mapa = modelo.contagemPalavras.get(classe);
        const totalPalavras = modelo.totalPalavrasClasse.get(classe);

        let score = prior;

        for (const token of palavrasConhecidas) {
            const frequencia = mapa.get(token) || 0;
            const probabilidade =
                (frequencia + modelo.alpha) /
                (totalPalavras + modelo.alpha * tamanhoVocabulario);

            score += Math.log(probabilidade);
        }

        pontuacoes.push({ classe, score });
    }

    pontuacoes.sort((a, b) => b.score - a.score);

    const maiorScore = pontuacoes[0].score;
    const expScores = pontuacoes.map(p => Math.exp(p.score - maiorScore));
    const soma = expScores.reduce((a, b) => a + b, 0);

    const probabilidades = pontuacoes.map((p, i) => ({
        classe: p.classe,
        probabilidade: expScores[i] / soma
    }));

    return {
        classe: probabilidades[0].classe,
        confianca: probabilidades[0].probabilidade,
        probabilidades,
        tokensReconhecidos: palavrasConhecidas.length
    };
}

/* =========================================================
   5. MÉTRICAS E MATRIZ DE CONFUSÃO REAIS
   ========================================================= */

function avaliarModelo(modelo, teste, classes) {
    const matriz = {};
    classes.forEach(real => {
        matriz[real] = {};
        classes.forEach(prev => matriz[real][prev] = 0);
    });

    let acertos = 0;

    teste.forEach(item => {
        const previsao = preverNaiveBayes(modelo, item.texto).classe;
        if (!matriz[item.classe]) {
            matriz[item.classe] = {};
            classes.forEach(c => matriz[item.classe][c] = 0);
        }
        if (matriz[item.classe][previsao] === undefined) {
            matriz[item.classe][previsao] = 0;
        }

        matriz[item.classe][previsao]++;

        if (previsao === item.classe) acertos++;
    });

    const total = teste.length;
    const acuracia = total ? acertos / total : 0;

    let somaPrecisao = 0;
    let somaRecall = 0;
    let somaF1 = 0;
    let classesAvaliadas = 0;

    classes.forEach(classe => {
        let vp = matriz[classe]?.[classe] || 0;
        let fp = 0;
        let fn = 0;

        classes.forEach(real => {
            if (real !== classe) {
                fp += matriz[real]?.[classe] || 0;
                fn += matriz[classe]?.[real] || 0;
            }
        });

        const suporte = classes.reduce(
            (s, c) => s + (matriz[classe]?.[c] || 0), 0
        );

        if (suporte === 0) return;

        const precisao = vp + fp ? vp / (vp + fp) : 0;
        const recall = vp + fn ? vp / (vp + fn) : 0;
        const f1 = precisao + recall
            ? 2 * precisao * recall / (precisao + recall)
            : 0;

        somaPrecisao += precisao;
        somaRecall += recall;
        somaF1 += f1;
        classesAvaliadas++;
    });

    return {
        matriz,
        total,
        acertos,
        erros: total - acertos,
        acuracia,
        precisao: classesAvaliadas ? somaPrecisao / classesAvaliadas : 0,
        recall: classesAvaliadas ? somaRecall / classesAvaliadas : 0,
        f1: classesAvaliadas ? somaF1 / classesAvaliadas : 0
    };
}

function percentual(valor) {
    return (valor * 100).toFixed(2) + "%";
}

function renderizarMatrizConfusao(classes, matriz) {
    const box = $("confusion-matrix-box");
    let html = `
        <p class="text-xs text-slate-500 mb-3">
            Linhas = classe real; colunas = classe prevista.
            Os valores correspondem ao conjunto de teste.
        </p>
        <div class="overflow-x-auto">
        <table class="w-full text-center border-collapse text-[11px]">
        <thead><tr class="bg-slate-200 text-slate-700">
        <th class="p-2 border">Real \\ Prevista</th>`;

    classes.forEach(c => {
        html += `<th class="p-2 border">${escaparHTML(c)}</th>`;
    });

    html += "</tr></thead><tbody>";

    classes.forEach(real => {
        html += `<tr><th class="p-2 border bg-slate-100 text-left">${escaparHTML(real)}</th>`;

        classes.forEach(prev => {
            const valor = matriz[real]?.[prev] || 0;
            const diagonal = real === prev;
            const cor = diagonal
                ? "bg-emerald-100 font-bold text-emerald-900"
                : valor > 0
                    ? "bg-rose-50 text-rose-800"
                    : "text-slate-400";

            html += `<td class="p-2 border ${cor}">${valor}</td>`;
        });

        html += "</tr>";
    });

    html += "</tbody></table></div>";
    box.innerHTML = html;
}

/* =========================================================
   6. SUBMISSÃO DA BASE
   ========================================================= */

function submeterDados() {
    if (!datasetBruto.length) {
        mostrarAlerta("Selecione um arquivo CSV válido primeiro.");
        return;
    }

    classesUnicas = [...new Set(datasetBruto.map(d => d.classe))].sort();

    if (classesUnicas.length < 2) {
        mostrarAlerta("A base precisa conter pelo menos duas classes distintas.");
        return;
    }

    const divisao = dividirTreinoTeste(datasetBruto);

    $("stat-total-reg").textContent = datasetBruto.length;
    $("stat-split-pct").textContent = "Aproximadamente 80% / 20%";
    $("stat-classes-count").textContent = classesUnicas.length + " classes";
    $("stat-split-abs").textContent =
        `${divisao.treino.length} treino / ${divisao.teste.length} teste`;

    const container = $("classes-chips-container");
    container.innerHTML = "";

    classesUnicas.forEach(classe => {
        const chip = document.createElement("span");
        chip.className =
            "bg-indigo-50 text-indigo-700 border border-indigo-200 " +
            "text-[11px] font-semibold px-3 py-1 rounded-xl";
        chip.textContent = classe;
        container.appendChild(chip);
    });

    esconderAlerta();
    mostrarSecao("section-visualizacao");
    atualizarIndicadores(2);
}

$("select-algoritmo").addEventListener("change", function(e) {
    const descricoes = {
        "naive-bayes":
            "<strong>Naive Bayes:</strong> classificador probabilístico treinado com as mensagens e classes do CSV.",
        "knn":

        "decision-tree":
            "<strong>Árvore de Decisão:</strong> esta opção ainda não está implementada neste script.",

    };

    $("alg-description").innerHTML = descricoes[e.target.value];
});

function iniciarTreinamento() {
    if (!datasetBruto.length) {
        mostrarAlerta("Importe e submeta a base antes de treinar.");
        return;
    }

    const algoritmo = $("select-algoritmo").value;

    if (algoritmo !== "naive-bayes") {
        mostrarAlerta(
            "Neste script, somente o Naive Bayes está implementado. " +
            "Selecione Naive Bayes para executar um treinamento real."
        );
        return;
    }

    mostrarSecao("section-treinamento");
    atualizarIndicadores(3);

    $("training-progress-box").classList.remove("hidden");
    $("training-results").classList.add("hidden");
    $("training-status-text").textContent =
        "Treinando e avaliando o Naive Bayes com os dados importados...";

    setTimeout(() => {
        try {
            const inicio = performance.now();
            const divisao = dividirTreinoTeste(datasetBruto);

            modeloTreino = treinarNaiveBayes(divisao.treino);

            avaliacaoAtual = avaliarModelo(
                modeloTreino,
                divisao.teste,
                classesUnicas
            );

            // O modelo de uso prático é treinado com toda a base.
            modeloFinal = treinarNaiveBayes(datasetBruto);

            const tempo = performance.now() - inicio;
            const a = avaliacaoAtual;

            matrizAtual = a.matriz;

            resultadosConsolidados["naive-bayes"] = {
                nome: "Naive Bayes",
                acuracia: percentual(a.acuracia),
                precisao: percentual(a.precisao),
                recall: percentual(a.recall),
                f1: percentual(a.f1),
                tempo: tempo.toFixed(1) + " ms"
            };

            $("metric-acc").textContent = percentual(a.acuracia);
            $("metric-prec").textContent = percentual(a.precisao);
            $("metric-rec").textContent = percentual(a.recall);
            $("metric-f1").textContent = percentual(a.f1);
            $("metric-hits-errors").textContent =
                `${a.acertos} acertos / ${a.erros} erros`;
            $("metric-time").textContent = tempo.toFixed(1) + " ms";
            $("res-alg-title").textContent =
                "Naive Bayes treinado e avaliado com a base importada.";

            renderizarMatrizConfusao(classesUnicas, a.matriz);
            renderizarTabelaConsolidada();

            $("training-progress-box").classList.add("hidden");
            $("training-results").classList.remove("hidden");
            esconderAlerta();

        } catch (erro) {
            $("training-progress-box").classList.add("hidden");
            mostrarAlerta("Erro no treinamento: " + erro.message);
        }
    }, 20);
}

function renderizarTabelaConsolidada() {
    const tbody = document.querySelector("#tabela-consolidada tbody");
    tbody.innerHTML = "";

    Object.values(resultadosConsolidados).forEach(res => {
        const tr = document.createElement("tr");
        tr.className = "hover:bg-slate-50";

        [
            res.nome, res.acuracia, res.precisao,
            res.recall, res.f1, res.tempo, "Concluído"
        ].forEach((valor, i) => {
            const td = document.createElement("td");
            td.className = "p-3.5";
            td.textContent = valor;

            if (i === 0) td.classList.add("font-bold", "text-slate-800");
            if (i === 6) td.classList.add("text-emerald-700");

            tr.appendChild(td);
        });

        tbody.appendChild(tr);
    });
}

/* =========================================================
   7. CLASSIFICAÇÃO DE NOVAS MENSAGENS
   ========================================================= */

function classificarTexto() {
    const texto = $("input-texto-teste").value.trim();

    if (!texto) {
        mostrarAlerta("Digite uma mensagem para classificar.");
        return;
    }

    if (!modeloFinal) {
        mostrarAlerta("Treine o modelo antes de classificar mensagens.");
        return;
    }

    esconderAlerta();

    const previsao = preverNaiveBayes(modeloFinal, texto);
    const sinaisAtencao = detectarNecessidadeAtendimentoHumano(texto);

    // A classe exibida vem do modelo treinado.
    // O encaminhamento humano é um alerta separado, não uma classe.
    $("res-badge").textContent = previsao.classe;
    $("res-confianca").textContent = percentual(previsao.confianca);

    const explicacao = sinaisAtencao.length
        ? "ATENÇÃO: foram identificados os seguintes termos: " +
          sinaisAtencao.join(", ") + ". Encaminhe a mensagem para avaliação " +
          "humana conforme o protocolo de atendimento. A classe mostrada " +
          "é a previsão do modelo e não substitui a triagem clínica."
        : "A classe foi prevista pelo Naive Bayes treinado com a base importada. " +
          "A confiança é uma probabilidade estimada pelo modelo, não uma " +
          "medida de certeza clínica.";

    $("res-explicacao").textContent = explicacao;

    const container = $("resultado-container");
    container.classList.remove("hidden");

    if (sinaisAtencao.length) {
        container.classList.remove("bg-slate-50", "border-slate-200");
        container.classList.add("bg-amber-50", "border-amber-400");
        $("res-badge").className =
            "px-3 py-1.5 rounded-full text-xs font-bold uppercase " +
            "tracking-wider bg-amber-100 text-amber-900";
    } else {
        container.classList.remove("bg-amber-50", "border-amber-400");
        container.classList.add("bg-slate-50", "border-slate-200");
        $("res-badge").className =
            "px-3 py-1.5 rounded-full text-xs font-bold uppercase " +
            "tracking-wider bg-indigo-100 text-indigo-800";
    }

    // Teste manual não tem rótulo real conhecido.
    // Portanto, não se inventam acertos ou erros.
    totalTestes++;
    $("test-count").textContent = totalTestes;
    $("test-hits").textContent = "—";
    $("test-errors").textContent = "—";

    adicionarAoHistorico(
        texto,
        previsao.classe,
        percentual(previsao.confianca),
        sinaisAtencao
    );
}

function adicionarAoHistorico(texto, classe, confianca, sinaisAtencao = []) {
    historicoTestes.unshift({
        texto,
        classe,
        confianca,
        horario: new Date().toLocaleTimeString("pt-BR"),
        encaminhar: sinaisAtencao.length > 0,
        sinais: sinaisAtencao
    });

    const tbody = document.querySelector("#historico-table tbody");
    tbody.innerHTML = "";

    historicoTestes.forEach(item => {
        const tr = document.createElement("tr");
        tr.className = "hover:bg-slate-50";

        const valores = [
            item.texto,
            item.classe,
            item.confianca,
            item.horario
        ];

        valores.forEach((valor, i) => {
            const td = document.createElement("td");
            td.className = "p-3.5";
            td.textContent = valor;

            if (i === 1) {
                td.classList.add("font-semibold", "text-indigo-700");
            }

            tr.appendChild(td);
        });

        if (item.encaminhar) {
            tr.title = "Encaminhar para avaliação humana: " +
                item.sinais.join(", ");
            tr.classList.add("bg-amber-50");
        }

        tbody.appendChild(tr);
    });
}

function limparHistorico() {
    historicoTestes = [];
    totalTestes = 0;
    totalAcertos = 0;
    totalErros = 0;

    $("test-count").textContent = "0";
    $("test-hits").textContent = "—";
    $("test-errors").textContent = "—";

    document.querySelector("#historico-table tbody").innerHTML =
        '<tr id="empty-history">' +
        '<td colspan="4" class="p-6 text-center text-slate-400">' +
        'Nenhum teste realizado ainda.</td></tr>';
}

/* =========================================================
   8. RELATÓRIO PDF
   ========================================================= */

function gerarRelatorioPDF() {
    if (!avaliacaoAtual) {
        mostrarAlerta("Treine o modelo antes de gerar o relatório.");
        return;
    }

    if (!window.jspdf || !window.jspdf.jsPDF) {
        mostrarAlerta(
            "A biblioteca de PDF não foi carregada. Verifique a conexão."
        );
        return;
    }

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    doc.setFont("helvetica", "bold");
    doc.setFontSize(15);
    doc.text("Relatório de Machine Learning", 14, 20);

    doc.setFont("helvetica", "normal");
    doc.setFontSize(10);
    doc.text("Aluna: Marcia Regina Godoy", 14, 28);
    doc.text("Data: " + new Date().toLocaleDateString("pt-BR"), 14, 34);
    doc.text("Registros: " + datasetBruto.length, 14, 40);
    doc.text("Classes: " + classesUnicas.length, 14, 46);
    doc.text("Algoritmo: Naive Bayes Multinomial", 14, 52);
    doc.text(
        "Métricas calculadas no conjunto de teste; modelo final treinado com toda a base.",
        14, 58
    );

    const a = avaliacaoAtual;

    const linhas = [
        ["Acurácia", percentual(a.acuracia)],
        ["Precisão macro", percentual(a.precisao)],
        ["Recall macro", percentual(a.recall)],
        ["F1-score macro", percentual(a.f1)],
        ["Acertos", String(a.acertos)],
        ["Erros", String(a.erros)],
        ["Tamanho do teste", String(a.total)]
    ];

    if (typeof doc.autoTable === "function") {
        doc.autoTable({
            startY: 65,
            head: [["Métrica", "Resultado"]],
            body: linhas,
            theme: "grid"
        });
    } else {
        let y = 68;
        linhas.forEach(linha => {
            doc.text(linha[0] + ": " + linha[1], 14, y);
            y += 7;
        });
    }

    doc.save("Relatorio_Machine_Learning_Marcia_Godoy.pdf");
}
