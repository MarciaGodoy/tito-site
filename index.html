
<script>
"use strict";

/* =========================================================
   LABORATÓRIO DE MACHINE LEARNING
   Classificação de mensagens maternas
   - Importação de CSV
   - Naive Bayes Multinomial
   - Avaliação com conjunto de teste
   - Alerta de urgência independente do modelo
   ========================================================= */

const $ = id => document.getElementById(id);

let dados = [];
let classes = [];
let modelo = null;
let avaliacao = null;
let historico = [];
let contagemTestes = 0;
let acertosTeste = 0;
let errosTeste = 0;
let ultimaPredicao = null;
let arquivoAtual = null;

/* -------------------- ALERTAS DA INTERFACE -------------------- */

function mostrarAlerta(mensagem, tipo = "erro") {
  const caixa = $("alert-box");
  const texto = $("alert-message");

  if (texto) texto.textContent = mensagem;

  if (caixa) {
    caixa.style.display = "block";
    caixa.classList.remove("hidden");
    caixa.style.borderColor =
      tipo === "sucesso" ? "#16a34a" :
      tipo === "aviso" ? "#d97706" : "#dc2626";
  } else {
    alert(mensagem);
  }
}

function ocultarAlerta() {
  const caixa = $("alert-box");
  if (caixa) {
    caixa.style.display = "none";
    caixa.classList.add("hidden");
  }
}

/* -------------------- NORMALIZAÇÃO -------------------- */

function normalizarTexto(texto) {
  return String(texto ?? "")
    .replace(/^\uFEFF/, "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/[’']/g, " ")
    .replace(/[^\p{L}\p{N}\s]/gu, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function tokenizar(texto) {
  return normalizarTexto(texto)
    .split(/\s+/)
    .filter(palavra => palavra.length > 1);
}

/* -------------------- REGRA INDEPENDENTE DE URGÊNCIA --------------------
   Esta regra NÃO cria uma classe no treinamento.
   Ela gera um alerta de encaminhamento humano, separado da previsão.
   A lista precisa ser validada por profissionais de saúde antes de
   qualquer uso clínico real.
   ----------------------------------------------------------------------- */

function detectarUrgencia(texto) {
  const t = normalizarTexto(texto);

  const regras = [
    /\bhemorragia\b/,
    /\bhemorragias\b/,
    /\bsangramento\b/,
    /\bsangramentos\b/,
    /\bsangrando\b/,
    /\bperda de sangue\b/,
    /\bdor\b/,
    /\bdores\b/,
    /\bfebre\b/,
    /\bpressao alta\b/,
    /\bpressao arterial alta\b/,
    /\bpressao muito alta\b/,
    /\bbebe nao se mexe\b/,
    /\bbebe nao mexe\b/,
    /\bbebe parou de mexer\b/,
    /\bbebe mexe menos\b/,
    /\bbebe esta mexendo menos\b/,
    /\bmovimentos fetais diminuidos\b/,
    /\bfalta de ar\b/
  ];

  return regras.some(regra => regra.test(t));
}

/* -------------------- LEITURA DE CSV -------------------- */

function detectarSeparador(texto) {
  const primeiraLinha = (texto.split(/\r?\n/).find(l => l.trim()) || "");
  const candidatos = [",", ";", "\t"];
  let melhor = ",";
  let maior = -1;

  candidatos.forEach(separador => {
    let quantidade = 0;
    let dentroAspas = false;

    for (let i = 0; i < primeiraLinha.length; i++) {
      const c = primeiraLinha[i];

      if (c === '"') {
        if (dentroAspas && primeiraLinha[i + 1] === '"') {
          i++;
        } else {
          dentroAspas = !dentroAspas;
        }
      } else if (c === separador && !dentroAspas) {
        quantidade++;
      }
    }

    if (quantidade > maior) {
      maior = quantidade;
      melhor = separador;
    }
  });

  return melhor;
}

function analisarCSV(texto, separador) {
  const linhas = [];
  let linha = [];
  let campo = "";
  let dentroAspas = false;

  texto = texto.replace(/^\uFEFF/, "");

  for (let i = 0; i < texto.length; i++) {
    const c = texto[i];

    if (c === '"') {
      if (dentroAspas && texto[i + 1] === '"') {
        campo += '"';
        i++;
      } else {
        dentroAspas = !dentroAspas;
      }
    } else if (c === separador && !dentroAspas) {
      linha.push(campo);
      campo = "";
    } else if ((c === "\n" || c === "\r") && !dentroAspas) {
      if (c === "\r" && texto[i + 1] === "\n") i++;

      linha.push(campo);

      if (linha.some(v => String(v).trim() !== "")) {
        linhas.push(linha);
      }

      linha = [];
      campo = "";
    } else {
      campo += c;
    }
  }

  if (campo !== "" || linha.length > 0) {
    linha.push(campo);

    if (linha.some(v => String(v).trim() !== "")) {
      linhas.push(linha);
    }
  }

  return linhas;
}

function localizarColunas(cabecalho) {
  const nomes = cabecalho.map(v =>
    normalizarTexto(v).replace(/[\s_-]+/g, "")
  );

  const colunaTexto = nomes.findIndex(v =>
    ["texto", "mensagem", "mensagens", "text", "message"].includes(v)
  );

  const colunaClasse = nomes.findIndex(v =>
    ["classe", "class", "categoria", "label", "rotulo"].includes(v)
  );

  return { colunaTexto, colunaClasse };
}

function importarCSV(texto) {
  const separador = detectarSeparador(texto);
  const linhas = analisarCSV(texto, separador);

  if (linhas.length < 2) {
    throw new Error(
      "O CSV precisa conter o cabeçalho e pelo menos uma mensagem."
    );
  }

  const colunas = localizarColunas(linhas[0]);

  if (colunas.colunaTexto < 0 || colunas.colunaClasse < 0) {
    throw new Error(
      "Não encontrei as colunas texto e classe. " +
      "Verifique o cabeçalho do arquivo."
    );
  }

  const registros = [];

  for (let i = 1; i < linhas.length; i++) {
    const linha = linhas[i];

    const textoOriginal = String(
      linha[colunas.colunaTexto] ?? ""
    ).trim();

    const classeOriginal = String(
      linha[colunas.colunaClasse] ?? ""
    ).trim();

    if (!textoOriginal || !classeOriginal) continue;

    registros.push({
      texto: textoOriginal,
      classe: classeOriginal
    });
  }

  if (registros.length === 0) {
    throw new Error(
      "Nenhuma mensagem válida foi encontrada nas colunas texto e classe."
    );
  }

  return registros;
}

/* -------------------- INTERFACE DO ARQUIVO -------------------- */

function configurarImportacao() {
  const entrada = $("csvFile") || $("file");

  if (!entrada) return;

  entrada.addEventListener("change", function () {
    ocultarAlerta();

    const arquivo = entrada.files && entrada.files[0];
    if (!arquivo) return;

    arquivoAtual = arquivo;

    const leitor = new FileReader();

    leitor.onload = function (evento) {
      try {
        dados = importarCSV(String(evento.target.result || ""));

        classes = [...new Set(dados.map(d => d.classe))].sort();

        modelo = null;
        avaliacao = null;
        historico = [];
        contagemTestes = 0;
        acertosTeste = 0;
        errosTeste = 0;
        ultimaPredicao = null;

        atualizarDadosArquivo(arquivo);
        mostrarPrevia();
        atualizarEstatisticas();

        mostrarAlerta(
          "Arquivo importado: " + dados.length +
          " mensagens válidas e " + classes.length + " classes.",
          "sucesso"
        );
      } catch (erro) {
        dados = [];
        classes = [];
        modelo = null;
        avaliacao = null;

        mostrarAlerta(
          "Não foi possível importar o CSV. " + erro.message
        );
      }
    };

    leitor.onerror = function () {
      mostrarAlerta("O navegador não conseguiu ler o arquivo.");
    };

    leitor.readAsText(arquivo, "UTF-8");
  });
}

function definirTexto(id, valor) {
  const elemento = $(id);
  if (elemento) elemento.textContent = valor;
}

function atualizarDadosArquivo(arquivo) {
  definirTexto("file-name", arquivo.name);
  definirTexto(
    "file-size",
    (arquivo.size / 1024).toFixed(1) + " KB"
  );
  definirTexto("file-rows", String(dados.length));
  definirTexto("file-status", "CSV importado");
}

function mostrarPrevia() {
  const corpo = $("preview-tbody");
  if (!corpo) return;

  corpo.innerHTML = "";

  dados.slice(0, 10).forEach(registro => {
    const tr = document.createElement("tr");

    const tdTexto = document.createElement("td");
    tdTexto.textContent = registro.texto;

    const tdClasse = document.createElement("td");
    tdClasse.textContent = registro.classe;

    tr.appendChild(tdTexto);
    tr.appendChild(tdClasse);
    corpo.appendChild(tr);
  });

  const contagem = $("file-rows");
  if (contagem) contagem.textContent = String(dados.length);

  const container = $("preview-container");
  if (container) container.style.display = "block";
}

/* -------------------- ESTATÍSTICAS DA BASE -------------------- */

function atualizarEstatisticas() {
  definirTexto("stat-total-reg", String(dados.length));
  definirTexto("stat-classes-count", String(classes.length));

  const chips = $("classes-chips-container");

  if (chips) {
    chips.innerHTML = "";

    classes.forEach(classe => {
      const quantidade = dados.filter(d => d.classe === classe).length;
      const chip = document.createElement("span");

      chip.textContent = classe + " (" + quantidade + ")";
      chip.style.display = "inline-block";
      chip.style.margin = "4px";
      chip.style.padding = "5px 9px";
      chip.style.borderRadius = "12px";
      chip.style.background = "#e8eef8";
      chip.style.color = "#172033";
      chip.style.fontSize = "12px";

      chips.appendChild(chip);
    });
  }
}

/* -------------------- DIVISÃO TREINO / TESTE -------------------- */

function dividirDados(registros, proporcaoTeste = 0.2) {
  const porClasse = {};

  registros.forEach(registro => {
    if (!porClasse[registro.classe]) {
      porClasse[registro.classe] = [];
    }
    porClasse[registro.classe].push(registro);
  });

  const treino = [];
  const teste = [];

  Object.keys(porClasse).forEach(classe => {
    const grupo = porClasse[classe].slice();

    for (let i = grupo.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [grupo[i], grupo[j]] = [grupo[j], grupo[i]];
    }

    let nTeste = Math.round(grupo.length * proporcaoTeste);

    if (grupo.length > 1) {
      nTeste = Math.max(1, Math.min(grupo.length - 1, nTeste));
    } else {
      nTeste = 0;
    }

    teste.push(...grupo.slice(0, nTeste));
    treino.push(...grupo.slice(nTeste));
  });

  return { treino, teste };
}

/* -------------------- NAIVE BAYES MULTINOMIAL -------------------- */

function treinarNaiveBayes(registros) {
  if (!registros.length) {
    throw new Error("Não há dados para treinar o modelo.");
  }

  const contagemClasse = {};
  const contagemPalavra = {};
  const totalPalavrasClasse = {};
  const vocabulario = new Set();

  registros.forEach(registro => {
    const classe = registro.classe;

    contagemClasse[classe] = (contagemClasse[classe] || 0) + 1;
    contagemPalavra[classe] = contagemPalavra[classe] || {};
    totalPalavrasClasse[classe] = totalPalavrasClasse[classe] || 0;

    tokenizar(registro.texto).forEach(palavra => {
      vocabulario.add(palavra);

      contagemPalavra[classe][palavra] =
        (contagemPalavra[classe][palavra] || 0) + 1;

      totalPalavrasClasse[classe]++;
    });
  });

  return {
    contagemClasse,
    contagemPalavra,
    totalPalavrasClasse,
    vocabulario,
    totalRegistros: registros.length,
    classes: Object.keys(contagemClasse)
  };
}

function preverNaiveBayes(texto, modeloTreinado) {
  const palavras = tokenizar(texto);

  if (!palavras.length) {
    throw new Error("Digite uma mensagem com palavras para classificar.");
  }

  const tamanhoVocabulario = Math.max(
    modeloTreinado.vocabulario.size, 1
  );

  let melhorClasse = null;
  let maiorPontuacao = -Infinity;
  const pontuacoes = {};

  modeloTreinado.classes.forEach(classe => {
    const nClasse = modeloTreinado.contagemClasse[classe];

    let pontuacao = Math.log(
      nClasse / modeloTreinado.totalRegistros
    );

    const totalPalavras =
      modeloTreinado.totalPalavrasClasse[classe];

    palavras.forEach(palavra => {
      const frequencia =
        (modeloTreinado.contagemPalavra[classe][palavra] || 0);

      // Suavização de Laplace
      const probabilidade =
        (frequencia + 1) /
        (totalPalavras + tamanhoVocabulario);

      pontuacao += Math.log(probabilidade);
    });

    pontuacoes[classe] = pontuacao;

    if (pontuacao > maiorPontuacao) {
      maiorPontuacao = pontuacao;
      melhorClasse = classe;
    }
  });

  const valores = Object.values(pontuacoes);
  const maior = Math.max(...valores);
  const expValores = valores.map(v => Math.exp(v - maior));
  const soma = expValores.reduce((a, b) => a + b, 0);
  const indice = Object.keys(pontuacoes).indexOf(melhorClasse);

  const confianca = soma > 0
    ? expValores[indice] / soma
    : 0;

  return {
    classe: melhorClasse,
    confianca,
    pontuacoes
  };
}

/* -------------------- AVALIAÇÃO DO MODELO -------------------- */

function calcularMetricas(registrosTeste, modeloTeste) {
  const matriz = {};
  let acertos = 0;

  const todasClasses = [...new Set([
    ...classes,
    ...modeloTeste.classes
  ])];

  todasClasses.forEach(classe => {
    matriz[classe] = {};
    todasClasses.forEach(prevista => {
      matriz[classe][prevista] = 0;
    });
  });

  registrosTeste.forEach(registro => {
    const previsao = preverNaiveBayes(
      registro.texto, modeloTeste
    ).classe;

    if (!matriz[registro.classe]) {
      matriz[registro.classe] = {};
    }

    if (matriz[registro.classe][previsao] === undefined) {
      matriz[registro.classe][previsao] = 0;
    }

    matriz[registro.classe][previsao]++;

    if (previsao === registro.classe) acertos++;
  });

  const total = registrosTeste.length;
  const acuracia = total ? acertos / total : 0;

  let somaPrecisao = 0;
  let somaRecall = 0;
  let somaF1 = 0;
  let nClassesAvaliadas = 0;

  todasClasses.forEach(classe => {
    let verdadeirosPositivos = matriz[classe]?.[classe] || 0;
    let falsosPositivos = 0;
    let falsosNegativos = 0;

    todasClasses.forEach(outra => {
      if (outra !== classe) {
        falsosPositivos += matriz[outra]?.[classe] || 0;
        falsosNegativos += matriz[classe]?.[outra] || 0;
      }
    });

    const precisao = verdadeirosPositivos + falsosPositivos
      ? verdadeirosPositivos /
        (verdadeirosPositivos + falsosPositivos)
      : 0;

    const recall = verdadeirosPositivos + falsosNegativos
      ? verdadeirosPositivos /
        (verdadeirosPositivos + falsosNegativos)
      : 0;

    const f1 = precisao + recall
      ? 2 * precisao * recall / (precisao + recall)
      : 0;

    if (
      verdadeirosPositivos + falsosPositivos +
      falsosNegativos > 0
    ) {
      somaPrecisao += precisao;
      somaRecall += recall;
      somaF1 += f1;
      nClassesAvaliadas++;
    }
  });

  return {
    total,
    acertos,
    erros: total - acertos,
    acuracia,
    precisao: nClassesAvaliadas ? somaPrecisao / nClassesAvaliadas : 0,
    recall: nClassesAvaliadas ? somaRecall / nClassesAvaliadas : 0,
    f1: nClassesAvaliadas ? somaF1 / nClassesAvaliadas : 0,
    matriz,
    classes: todasClasses
  };
}

function percentual(valor) {
  return (100 * valor).toFixed(1) + "%";
}

function mostrarMatrizConfusao(resultado) {
  const caixa = $("confusion-matrix-box");
  if (!caixa) return;

  caixa.innerHTML = "";

  const tabela = document.createElement("table");
  tabela.style.width = "100%";
  tabela.style.borderCollapse = "collapse";
  tabela.style.fontSize = "12px";

  const thead = document.createElement("thead");
  const cabecalho = document.createElement("tr");

  const canto = document.createElement("th");
  canto.textContent = "Real / Prevista";
  cabecalho.appendChild(canto);

  resultado.classes.forEach(classe => {
    const th = document.createElement("th");
    th.textContent = classe;
    th.style.padding = "5px";
    cabecalho.appendChild(th);
  });

  thead.appendChild(cabecalho);
  tabela.appendChild(thead);

  const tbody = document.createElement("tbody");

  resultado.classes.forEach(real => {
    const tr = document.createElement("tr");
    const th = document.createElement("th");
    th.textContent = real;
    th.style.padding = "5px";
    tr.appendChild(th);

    resultado.classes.forEach(prevista => {
      const td = document.createElement("td");
      td.textContent = String(
        resultado.matriz[real]?.[prevista] || 0
      );
      td.style.padding = "5px";
      td.style.textAlign = "center";
      td.style.border = "1px solid #ddd";
      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });

  tabela.appendChild(tbody);
  caixa.appendChild(tabela);
}

/* -------------------- TREINAMENTO -------------------- */

function treinarModelo() {
  ocultarAlerta();

  if (dados.length < 2) {
    mostrarAlerta("Importe primeiro um CSV com pelo menos duas mensagens.");
    return;
  }

  const inicio = performance.now();

  try {
    const divisao = dividirDados(dados, 0.2);

    if (!divisao.treino.length) {
      throw new Error("Não há mensagens suficientes para treinamento.");
    }

    const modeloTeste = treinarNaiveBayes(divisao.treino);

    avaliacao = calcularMetricas(divisao.teste, modeloTeste);

    // Depois da avaliação, treina o modelo final com toda a base.
    modelo = treinarNaiveBayes(dados);

    const tempo = ((performance.now() - inicio) / 1000).toFixed(2);

    definirTexto("metric-acc", percentual(avaliacao.acuracia));
    definirTexto("metric-prec", percentual(avaliacao.precisao));
    definirTexto("metric-rec", percentual(avaliacao.recall));
    definirTexto("metric-f1", percentual(avaliacao.f1));
    definirTexto(
      "metric-hits-errors",
      avaliacao.acertos + " acertos / " + avaliacao.erros + " erros"
    );
    definirTexto("metric-time", tempo + " s");
    definirTexto("res-alg-title", "Naive Bayes Multinomial");
    definirTexto("stat-split-abs", String(divisao.treino.length));
    definirTexto("stat-split-pct", "80% treino / 20% teste");

    mostrarMatrizConfusao(avaliacao);

    const resultados = $("training-results");
    if (resultados) resultados.style.display = "block";

    const status = $("training-status-text");
    if (status) status.textContent = "Modelo treinado com sucesso";

    mostrarAlerta(
      "Treinamento concluído. A avaliação utiliza mensagens separadas " +
      "para teste; o modelo final foi treinado com toda a base.",
      "sucesso"
    );

    const progresso = $("training-progress-box");
    if (progresso) progresso.style.display = "none";

    const btn = $("train");
    if (btn) btn.disabled = false;

  } catch (erro) {
    mostrarAlerta("Erro no treinamento: " + erro.message);
  }
}

/* -------------------- CLASSIFICAÇÃO DE NOVA MENSAGEM -------------------- */

function exibirResultado(predicao, texto, alertaUrgencia) {
  ultimaPredicao = predicao;

  const resultado = $("resultado-container");
  if (resultado) resultado.style.display = "block";

  const badge = $("res-badge");
  const confianca = $("res-confianca");
  const explicacao = $("res-explicacao");

  if (alertaUrgencia) {
    // IMPORTANTE:
    // O texto do alerta NÃO é uma classe do modelo.
    // A classe prevista é mostrada separadamente para fins didáticos.
    if (badge) {
      badge.textContent = "ALERTA: ENCAMINHAR PARA AVALIAÇÃO HUMANA";
      badge.style.background = "#fee2e2";
      badge.style.color = "#991b1b";
      badge.style.padding = "8px";
      badge.style.borderRadius = "6px";
      badge.style.whiteSpace = "normal";
    }

    if (confianca) {
      confianca.textContent =
        "Classe prevista pelo modelo: " + predicao.classe;
    }

    if (explicacao) {
      explicacao.textContent =
        "A mensagem contém termo associado à regra de alerta de urgência. " +
        "Não use a classe prevista pelo modelo para descartar esse alerta. " +
        "Encaminhe para avaliação humana conforme o protocolo do serviço. " +
        "A regra é um mecanismo demonstrativo e não substitui triagem clínica.";
    }
  } else {
    if (badge) {
      badge.textContent = predicao.classe;
      badge.style.background = "#dbeafe";
      badge.style.color = "#1e40af";
      badge.style.padding = "8px";
      badge.style.borderRadius = "6px";
    }

    if (confianca) {
      confianca.textContent =
        "Confiança estimada pelo modelo: " +
        percentual(predicao.confianca);
    }

    if (explicacao) {
      explicacao.textContent =
        "Classificação calculada pelo Naive Bayes com base nas mensagens " +
        "de treinamento. A confiança é uma estimativa do modelo, não " +
        "uma probabilidade clínica validada.";
    }
  }

  historico.unshift({
    texto,
    classe: predicao.classe,
    urgencia: alertaUrgencia,
    confianca: predicao.confianca,
    data: new Date().toLocaleString("pt-BR")
  });

  atualizarHistorico();
}

function classificarMensagem() {
  ocultarAlerta();

  if (!modelo) {
    mostrarAlerta("Treine o modelo antes de classificar mensagens.");
    return;
  }

  const campo = $("input-texto-teste") || $("newText");
  const texto = campo ? campo.value.trim() : "";

  if (!texto) {
    mostrarAlerta("Digite uma mensagem para classificar.");
    return;
  }

  try {
    // A previsão do modelo e o alerta de urgência são calculados
    // separadamente. O alerta não depende da classe prevista.
    const alertaUrgencia = detectarUrgencia(texto);
    const predicao = preverNaiveBayes(texto, modelo);

    contagemTestes++;

    // Não existe rótulo verdadeiro para uma mensagem digitada
    // manualmente. Portanto, ela não conta como acerto ou erro.
    definirTexto("test-count", String(contagemTestes));
    definirTexto("test-hits", "—");
    definirTexto("test-errors", "—");

    exibirResultado(predicao, texto, alertaUrgencia);

    if (alertaUrgencia) {
      mostrarAlerta(
        "Alerta de encaminhamento humano ativado. " +
        "A classe prevista pelo modelo não cancela o alerta.",
        "aviso"
      );
    }
  } catch (erro) {
    mostrarAlerta("Não foi possível classificar a mensagem: " + erro.message);
  }
}

/* -------------------- HISTÓRICO -------------------- */

function atualizarHistorico() {
  const tabela = $("historico-table");
  if (!tabela) return;

  const corpo = tabela.querySelector("tbody") || tabela;
  corpo.innerHTML = "";

  historico.forEach(item => {
    const tr = document.createElement("tr");

    [
      item.data,
      item.texto,
      item.classe,
      item.urgencia ? "ALERTA HUMANO" : percentual(item.confianca)
    ].forEach(valor => {
      const td = document.createElement("td");
      td.textContent = valor;
      td.style.padding = "6px";
      td.style.borderBottom = "1px solid #ddd";
      tr.appendChild(td);
    });

    corpo.appendChild(tr);
  });
}

/* -------------------- NAVEGAÇÃO ENTRE ETAPAS -------------------- */

function irParaEtapa(numero) {
  const etapas = [
    "section-dados",
    "section-visualizacao",
    "section-treinamento",
    "section-teste"
  ];

  etapas.forEach((id, indice) => {
    const secao = $(id);
    if (secao) {
      secao.style.display = indice === numero - 1 ? "block" : "none";
    }

    const indicador = $("ind-step-" + (indice + 1));
    if (indicador) {
      indicador.style.opacity = indice === numero - 1 ? "1" : "0.55";
    }
  });

  ocultarAlerta();
}

function configurarNavegacao() {
  const botaoImportar = $("btn-submeter") || $("submitData");

  if (botaoImportar) {
    botaoImportar.addEventListener("click", function (evento) {
      evento.preventDefault();

      if (!dados.length) {
        mostrarAlerta("Selecione e importe um arquivo CSV válido.");
        return;
      }

      irParaEtapa(2);
    });
  }

  const botaoTreinar = $("train");

  if (botaoTreinar) {
    botaoTreinar.addEventListener("click", function (evento) {
      evento.preventDefault();
      treinarModelo();
    });
  }

  const botaoClassificar = $("classify");

  if (botaoClassificar) {
    botaoClassificar.addEventListener("click", function (evento) {
      evento.preventDefault();
      classificarMensagem();
    });
  }

  const algoritmo = $("select-algoritmo");

  if (algoritmo) {
    algoritmo.addEventListener("change", function () {
      const descricao = $("alg-description");

      if (algoritmo.value.toLowerCase().includes("naive")) {
        if (descricao) {
          descricao.textContent =
            "Naive Bayes Multinomial: algoritmo implementado neste simulador.";
        }
      } else {
        if (descricao) {
          descricao.textContent =
            "Este algoritmo não está implementado nesta versão. " +
            "Selecione Naive Bayes para executar o treinamento.";
        }
      }
    });
  }

  const botaoReset = $("reset");

  if (botaoReset) {
    botaoReset.addEventListener("click", function (evento) {
      evento.preventDefault();

      dados = [];
      classes = [];
      modelo = null;
      avaliacao = null;
      historico = [];
      contagemTestes = 0;
      acertosTeste = 0;
      errosTeste = 0;
      ultimaPredicao = null;
      arquivoAtual = null;

      const entrada = $("csvFile") || $("file");
      if (entrada) entrada.value = "";

      const campo = $("input-texto-teste") || $("newText");
      if (campo) campo.value = "";

      const previa = $("preview-tbody");
      if (previa) previa.innerHTML = "";

      const tabela = $("historico-table");
      if (tabela) {
        const corpo = tabela.querySelector("tbody") || tabela;
        corpo.innerHTML = "";
      }

      definirTexto("file-name", "Nenhum arquivo");
      definirTexto("file-size", "—");
      definirTexto("file-rows", "0");
      definirTexto("file-status", "Aguardando arquivo");
      definirTexto("stat-total-reg", "0");
      definirTexto("stat-classes-count", "0");
      definirTexto("metric-acc", "—");
      definirTexto("metric-prec", "—");
      definirTexto("metric-rec", "—");
      definirTexto("metric-f1", "—");
      definirTexto("metric-hits-errors", "—");
      definirTexto("metric-time", "—");
      definirTexto("test-count", "0");
      definirTexto("test-hits", "—");
      definirTexto("test-errors", "—");

      const chips = $("classes-chips-container");
      if (chips) chips.innerHTML = "";

      const matriz = $("confusion-matrix-box");
      if (matriz) matriz.innerHTML = "";

      const resultados = $("training-results");
      if (resultados) resultados.style.display = "none";

      const resultado = $("resultado-container");
      if (resultado) resultado.style.display = "none";

      irParaEtapa(1);
      ocultarAlerta();
    });
  }
}

/* -------------------- EXPORTAÇÃO SIMPLES DE RELATÓRIO -------------------- */

function exportarRelatorio() {
  if (!avaliacao) {
    mostrarAlerta("Treine o modelo antes de exportar o relatório.");
    return;
  }

  const linhas = [
    "RELATÓRIO DE CLASSIFICAÇÃO DE TEXTO",
    "",
    "Algoritmo: Naive Bayes Multinomial",
    "Mensagens importadas: " + dados.length,
    "Classes: " + classes.join(", "),
    "Mensagens no teste: " + avaliacao.total,
    "Acurácia: " + percentual(avaliacao.acuracia),
    "Precisão macro: " + percentual(avaliacao.precisao),
    "Recall macro: " + percentual(avaliacao.recall),
    "F1 macro: " + percentual(avaliacao.f1),
    "",
    "AVISO",
    "Este simulador é acadêmico. O alerta de urgência é uma regra demonstrativa",
    "e não substitui protocolos clínicos nem avaliação profissional."
  ];

  const blob = new Blob(
    [linhas.join("\n")],
    { type: "text/plain;charset=utf-8" }
  );

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = "relatorio_classificacao.txt";
  document.body.appendChild(link);
  link.click();
  link.remove();

  URL.revokeObjectURL(url);
}

/* -------------------- INICIALIZAÇÃO -------------------- */

document.addEventListener("DOMContentLoaded", function () {
  configurarImportacao();
  configurarNavegacao();

  const botaoExportar = $("export-pdf") || $("btn-exportar");

  if (botaoExportar) {
    botaoExportar.addEventListener("click", function (evento) {
      evento.preventDefault();
      exportarRelatorio();
    });
  }

  irParaEtapa(1);

  const progresso = $("training-progress-box");
  if (progresso) progresso.style.display = "none";

  const resultados = $("training-results");
  if (resultados) resultados.style.display = "none";

  const resultado = $("resultado-container");
  if (resultado) resultado.style.display = "none";
});
</script>
